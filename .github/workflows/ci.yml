name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.4).

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # The UI bundle must be fully self-contained: no remote URLs may survive
      # into dist/ui.html, or it will break under Figma's iframe CSP.
      - name: Assert UI bundle has no external references
        run: |
          if grep -Eoq 'https?://[^"'"'"')]+' dist/ui.html; then
            echo "dist/ui.html references a remote resource:"
            grep -Eo 'https?://[^"'"'"')]+' dist/ui.html
            exit 1
          fi
          echo "dist/ui.html is self-contained."
